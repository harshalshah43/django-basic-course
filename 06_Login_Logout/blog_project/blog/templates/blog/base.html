<html>

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <title>{{title}}</title>

</head>

<body class="bg-gray-50 text-gray-800">
    <!-- Nav Bar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600">B<a href = "{% url 'blog-home' %}">log Space</h1>
            <div class="space-x-6">
                {% if user.is_authenticated %}
                <!-- Welcome Message -->
                <span class="text-gray-700">
                    Welcome, <span class="font-semibold">{{ user.username }}</span>
                </span>
                <form method="POST" action="{% url 'logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit"
                        class="hover:text-indigo-600 bg-transparent border-none p-0 m-0 cursor-pointer">
                        Logout
                    </button>
                </form>
                {% else %}
                <a href="{% url 'login' %}" class="hover:text-indigo-600">Login</a>
                {% endif %}
                <a href="{% url 'register' %}" class="hover:text-indigo-600">Register</a>
                <a href="#" class="hover:text-indigo-600">Careers</a>
                <a href="{% url 'blog-home' %}" class="hover:text-indigo-600">Home</a>
                <a href="/blog/about/" class="hover:text-indigo-600">About</a>
            </div>
        </div>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
</body>

</html>
